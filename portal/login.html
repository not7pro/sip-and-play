<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Enterprise Portal Authentication — Sip & Play Systems</title>
  <link rel="stylesheet" href="portal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #15151e 0%, #08080a 100%);
      min-height: 100vh;
      padding: 1.5rem;
    }

    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: clamp(2rem, 5vw, 3rem);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .auth-box::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-emerald), transparent);
    }

    .auth-logo {
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.14em;
      color: #fff;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-badge {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      display: block;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
    }

    .auth-error {
      background: var(--accent-rose-dim);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff8888;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.5rem;
      display: none;
      text-transform: uppercase;
    }

    .auth-error.show {
      display: block;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <div class="auth-logo">
      SIP <em>&amp;</em> PLAY
    </div>
    <span class="auth-badge">COMMERCIAL INVENTORY &amp; ANALYTICS PLATFORM</span>

    <div class="auth-error" id="authError">
      ⚠ Invalid administrator credentials.
    </div>

    <form id="portalLoginForm" style="display:flex; flex-direction:column; gap:1.25rem;">
      <div class="form-group">
        <label class="form-label" for="authUser">Account Identifier</label>
        <input class="form-input" type="text" id="authUser" required placeholder="admin" autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="authPass">Security Passkey</label>
        <input class="form-input" type="password" id="authPass" required placeholder="••••••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-portal btn-portal--primary" type="submit" id="btnAuthSubmit" style="width:100%; justify-content:center; padding:0.85rem; margin-top:0.5rem;">
        Sign In to Portal →
      </button>
    </form>

    <div style="margin-top:2rem; padding-top:1.25rem; border-top:1px solid var(--border-subtle); display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:0.62rem; color:var(--text-dim);">
      <span>SRI LANKA ENTERPRISE</span>
      <span>SYSTEM STATUS: ONLINE</span>
    </div>
  </div>

  <script>
    'use strict';
    if (sessionStorage.getItem('sip_portal_auth') === 'true') {
      window.location.replace('index.html');
    }

    const form = document.getElementById('portalLoginForm');
    const authUser = document.getElementById('authUser');
    const authPass = document.getElementById('authPass');
    const authError = document.getElementById('authError');
    const btnSubmit = document.getElementById('btnAuthSubmit');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = authUser.value.trim().toLowerCase();
      const p = authPass.value.trim();

      btnSubmit.innerHTML = 'VERIFYING CREDENTIALS...';
      btnSubmit.disabled = true;

      setTimeout(() => {
        if ((u === 'admin' || u === 'manager') && (p === 'sipadmin2026' || p === 'admin123' || p === 'admin')) {
          sessionStorage.setItem('sip_portal_auth', 'true');
          sessionStorage.setItem('sip_portal_user', u);
          window.location.replace('index.html');
        } else {
          authError.classList.add('show');
          btnSubmit.innerHTML = 'Sign In to Portal →';
          btnSubmit.disabled = false;
          authPass.value = '';
          authPass.focus();
          setTimeout(() => authError.classList.remove('show'), 4000);
        }
      }, 400);
    });
  </script>
</body>
</html>
