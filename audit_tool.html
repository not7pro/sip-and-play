<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sip & Play Comprehensive Matcher</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #222; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; background: #fff; }
  th, td { border: 1px solid #ccc; padding: 8px 12px; font-size: 13px; text-align: left; }
  th { background: #333; color: #fff; }
  tr:nth-child(even) { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
  .badge-matched { background: #d4edda; color: #155724; }
  .badge-prior { background: #cce5ff; color: #004085; }
  .badge-new { background: #d1ecf1; color: #0c5460; }
  .badge-unmatched { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<h1>Sip &amp; Play Comprehensive Product Image Matcher</h1>
<div id="status">Running match engine...</div>
<div id="stats" style="font-size: 16px; margin: 15px 0;"></div>
<div id="actions" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
  <button id="btnCopyUpdates" style="padding: 10px 18px; font-size: 14px; cursor: pointer; background: #007bff; color: #fff; border: none; border-radius: 4px;">Copy JSON Updates</button>
  <button id="btnDownloadReport" style="padding: 10px 18px; font-size: 14px; cursor: pointer; background: #28a745; color: #fff; border: none; border-radius: 4px;">Download Full Audit Report (.md)</button>
  <button id="btnCopyAllMarkdown" style="padding: 10px 18px; font-size: 14px; cursor: pointer; background: #17a2b8; color: #fff; border: none; border-radius: 4px;">Copy All Added Images Markdown</button>
</div>
<textarea id="updatesOutput" style="width: 100%; height: 180px; font-family: monospace; margin-bottom: 20px;"></textarea>
<textarea id="reportChunk1" style="display:none;"></textarea>
<textarea id="reportChunk2" style="display:none;"></textarea>
<textarea id="reportChunk3" style="display:none;"></textarea>

    "ZQ-WCST-180,200.webp",
    "ZQ-WMDG-120,150,180,200.webp",
    "ZQ-XKGS-120  ZQ-XKGS-150  ZQ-XKGS-180 ZQ-XKGS-210.webp",
    "ZQ-XKGS-180 ZQ-XKGS-181 ZQ-XKGS-182 ZQ-XKGS-183.webp",
    "ZQ-XKJYTC-1270 ZQ-XKJYTC-1570 ZQ-XKJYTC-1870 ZQ-XKJYTC-2170.webp",
    "ZQ-XSC-150,180,200,220,240.webp",
    "ZQ-YMDG-120,150,180,200.webp",
    "ZQ-YYXSC-120,150,180.webp",
    "ZQ-ZH-2V.webp",
    "ZQ-ZH-3[ZH-3V.webp",
    "ZQ-ZH-4[ZH4V.webp",
    "ZQ-ZZJDT-60  ZQ-ZZJDT-80.webp",
    "ZQ147-01.webp",
    "ZQ147-02.webp",
    "ZQ147-03,04,05.webp",
    "ZQ149-01 ZQ149-02.webp",
    "ZQ149-03  ZQ149-04.webp",
    "ZQ149-05  ZQ149-06.webp",
    "ZQ149-07   ZQ149-08.webp",
    "ZQ150-01.webp",
    "ZQ150-03  ZQ150-04.webp",
    "ZQ150-05.webp",
    "ZQ151-01 ZQ151-02.webp",
    "ZQ151-03 ZQ151-04.webp",
    "ZQ151-05 ZQ151-06.webp",
    "ZQ151-07,08,09,10.webp",
    "ZQ151-11,12,13,14.webp",
    "ZQ152-01  ZQ152-02.webp",
    "ZQ152-03  ZQ152-04.webp",
    "ZQ152-05  ZQ152-06 ZQ152-07.webp",
    "ZQ152-08   ZQ152-09  ZQ152-10.webp",
    "ZQ152-11  ZQ152-12.webp",
    "ZQ152-13   ZQ152-14.webp",
    "ZQ155-01  ZQ155-02.webp",
    "ZQ157-01 ZQ157-02.webp",
    "ZQ157-03   ZQ157-04.webp",
    "ZQ157-05  ZQ157-06.webp",
    "ZQ157-07  ZQ157-08.webp",
    "ZQ158-01  ZQ158-02.webp",
    "ZQ158-03  ZQ158-04.webp",
    "ZQ158-07.webp",
    "ZQ159-01.webp",
    "ZQ159-02.webp",
    "ZQ159-04  ZQ159-05.webp",
    "ZQ159-06.webp",
    "ZQ159-07   ZQ159-08.webp",
    "ZQ159-09  ZQ159-10.webp",
    "ZQ159-13   ZQ159-14.webp",
    "视频_图片清晰度提升与去水印 (28).webp",
    "视频_图片清晰度提升与去水印 (87).webp",
    "视频_图片清晰度提升与去水印 - 2026-09-21T180455.911.webp",
    "视频_图片清晰度提升与去水印.webp"
  ];

  const allImages = [];
  ovenFiles.forEach(f => allImages.push({ folder: 'images/Oven Equipment', filename: f, path: 'images/Oven Equipment/' + f }));
  fridgeFiles.forEach(f => allImages.push({ folder: 'images/Refrigeration Equipment', filename: f, path: 'images/Refrigeration Equipment/' + f }));
  westernFiles.forEach(f => allImages.push({ folder: 'images/Western Kitchen Equipment Series', filename: f, path: 'images/Western Kitchen Equipment Series/' + f }));
  barFiles.forEach(f => allImages.push({ folder: 'images/Bar Equipments', filename: f, path: 'images/Bar Equipments/' + f }));
  foodMachineryFiles.forEach(f => allImages.push({ folder: 'images/Food Machinery', filename: f, path: 'images/Food Machinery/' + f }));
  kitchenFiles.forEach(f => allImages.push({ folder: 'images/Kitchen', filename: f, path: 'images/Kitchen/' + f }));
  steelFiles.forEach(f => allImages.push({ folder: 'images/Steel Items', filename: f, path: 'images/Steel Items/' + f }));

  function norm(str) {
    if (!str) return '';
    return str.toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function getTokens(filename) {
    let clean = filename.replace(/\.webp$/i, '');
    clean = clean.replace(/STOCK AVAILABLE/gi, ' ');
    clean = clean.replace(/STOCK/gi, ' ');
    clean = clean.replace(/WIND CURTAIN ARK/gi, ' ');
    clean = clean.replace(/视频_图片清晰度提升与去水印/gi, ' ');
    
    if (clean.includes(']')) {
      const parts = clean.split(']').filter(Boolean);
      const prefix = parts[0];
      const base = prefix.substring(0, prefix.lastIndexOf('-') + 1);
      const tokens = [prefix];
      for (let i = 1; i < parts.length; i++) {
        tokens.push(base + parts[i]);
      }
      return tokens;
    }

    let rawTokens = clean.split(/\s+/).map(t => t.trim().replace(/^[\.\,\-\_\(\)]+|[\.\,\-\_\(\)]+$/g, '')).filter(t => t.length >= 2);
    let expanded = [];
    rawTokens.forEach(t => {
      if (t.includes('+')) {
        let sub = t.split('+').filter(Boolean);
        expanded.push(...sub);
      } else {
        expanded.push(t);
      }
    });

    return Array.from(new Set(expanded));
  }

  allImages.forEach(img => {
    img.tokens = getTokens(img.filename);
  });

  const products = (typeof catalogProducts !== 'undefined' ? catalogProducts : []).map(p => ({
    ...p,
    normSku: norm(p.sku),
    normOcrSku: norm(p.ocrSku || ''),
    normName: norm(p.name || ''),
    currentImage: p.image,
    hasPriorMatch: p.image && p.image.startsWith('images/') && !p.image.includes('placeholder'),
    matchedImage: null,
    matchReason: null,
    matchType: null // 'prior' | 'exact' | 'ocr' | 'multi' | 'page' | 'spec'
  }));

  // Map of existing prior matches
  products.forEach(p => {
    if (p.hasPriorMatch) {
      p.matchedImage = p.image;
      p.matchReason = 'Prior implementation match';
      p.matchType = 'prior';
      const img = allImages.find(i => i.path === p.image);
      if (img) {
        if (!img.matchedProducts) img.matchedProducts = [];
        img.matchedProducts.push({ id: p.id, sku: p.sku, name: p.name, reason: p.matchReason, type: 'prior' });
      }
    }
  });

  // OCR Normalizer for tokens
  function getOcrKeys(str) {
    if (!str) return [];
    let n = norm(str);
    if (!n) return [];
    let keys = new Set();
    keys.add(n);
    
    // Replace leading OCR corruptions
    let zq = n.replace(/^(zo|2q|20|zaq|za|z0|7a|720)/, 'zq');
    keys.add(zq);
    
    // Core without zq
    let core = zq.replace(/^zq/, '');
    if (core.length >= 2) keys.add(core);

    // Common character substitutions
    let sub = zq
      .replace(/g/g, 'q')
      .replace(/0/g, 'o')
      .replace(/1/g, 'l');
    keys.add(sub);
    keys.add(sub.replace(/^zq/, ''));

    return Array.from(keys).filter(k => k.length >= 2);
  }

  // Build product key lookup
  const keyMap = new Map();
  products.forEach(p => {
    const keys = new Set();
    getOcrKeys(p.sku).forEach(k => keys.add(k));
    getOcrKeys(p.ocrSku).forEach(k => keys.add(k));
    getOcrKeys(p.name).forEach(k => keys.add(k));
    
    // Search otherSpecifications for embedded model codes
    if (p.otherSpecifications) {
      const tokens = p.otherSpecifications.split(/[\s,;"':\(\)]+/).filter(t => t.length >= 3);
      tokens.forEach(tok => {
        if (/^(zq|zo|2q|20|za|zh|7a|720)/i.test(tok) || tok.includes('-')) {
          getOcrKeys(tok).forEach(k => keys.add(k));
        }
      });
    }

    keys.forEach(k => {
      if (!keyMap.has(k)) keyMap.set(k, []);
      keyMap.get(k).push(p);
    });
  });

  // Match all 461 images
  allImages.forEach(img => {
    if (!img.matchedProducts) img.matchedProducts = [];

    // Check each token
    img.tokens.forEach(tok => {
      const tokKeys = getOcrKeys(tok);
      tokKeys.forEach(k => {
        if (keyMap.has(k)) {
          const prods = keyMap.get(k);
          prods.forEach(p => {
            const alreadyAssigned = p.matchedImage;
            const isSelf = p.matchedImage === img.path;
            
            if (!img.matchedProducts.some(mp => mp.id === p.id)) {
              img.matchedProducts.push({
                id: p.id,
                sku: p.sku,
                name: p.name,
                reason: `Matched token "${tok}" (key: ${k})`,
                type: alreadyAssigned ? (isSelf ? p.matchType : 'shared') : 'new'
              });
            }

            if (!p.matchedImage) {
              p.matchedImage = img.path;
              p.matchReason = `Matched token "${tok}" from ${img.filename}`;
              p.matchType = 'new';
            }
          });
        }
      });

      // Page-number match e.g. ZQ046-02.webp or ZQ085-01.webp
      const pgMatch = tok.match(/^ZQ0?(\d{2,3})[-_](\d{2})$/i);
      if (pgMatch) {
        const pageNum = parseInt(pgMatch[1], 10);
        products.forEach(p => {
          if (p.sourcePage === pageNum) {
            if (!img.matchedProducts.some(mp => mp.id === p.id)) {
              img.matchedProducts.push({
                id: p.id,
                sku: p.sku,
                name: p.name,
                reason: `Catalog page match: Page ${pageNum}`,
                type: p.matchedImage ? (p.matchedImage === img.path ? p.matchType : 'shared') : 'page'
              });
            }
            if (!p.matchedImage) {
              p.matchedImage = img.path;
              p.matchReason = `Matched catalog page ${pageNum} from ${img.filename}`;
              p.matchType = 'page';
            }
          }
        });
      }
    });

    // Substring match: check if filename contains product SKU directly
    const normFile = norm(img.filename.replace(/\.webp$/i, ''));
    products.forEach(p => {
      if (p.normSku && p.normSku.length >= 4 && normFile.includes(p.normSku)) {
        if (!img.matchedProducts.some(mp => mp.id === p.id)) {
          img.matchedProducts.push({
            id: p.id,
            sku: p.sku,
            name: p.name,
            reason: `Filename contains SKU ${p.sku}`,
            type: p.matchedImage ? (p.matchedImage === img.path ? p.matchType : 'shared') : 'new'
          });
        }
        if (!p.matchedImage) {
          p.matchedImage = img.path;
          p.matchReason = `Filename contains SKU ${p.sku}`;
          p.matchType = 'new';
        }
      }
    });
  });

  // Classification of unmatched images into A, B, C
  const matchedImages = allImages.filter(img => img.matchedProducts.length > 0);
  const unmatchedImages = allImages.filter(img => img.matchedProducts.length === 0);

  unmatchedImages.forEach(img => {
    let cat = 'C';
    let explanation = '';

    const pageRefMatch = img.filename.match(/^ZQ0?(\d{2,3})/i);
    if (pageRefMatch) {
      const pg = parseInt(pageRefMatch[1], 10);
      cat = 'C';
      explanation = `Source catalog page ${pg} had structured OCR extraction failure; products from this page were not imported into website dataset.`;
    } else if (img.filename.startsWith('视频_图片清晰度提升与去水印')) {
      cat = 'A';
      explanation = `Scratch/temp watermark removal file without identifiable model number tag.`;
    } else if (img.tokens.some(t => t.includes('CABINET') || t.includes('POPSICLE'))) {
      cat = 'C';
      explanation = `Commercial refrigeration specialty item in Zhong Qun catalog whose source page failed structured extraction.`;
    } else {
      cat = 'C';
      explanation = `Product model (${img.tokens.join(', ')}) exists in Zhong Qun catalog PDF, but belongs to pages with structured extraction failures and is missing from the website dataset.`;
    }

    img.category = cat;
    img.explanation = explanation;
  });

  const matchedProducts = products.filter(p => p.matchedImage);
  const unmatchedProducts = products.filter(p => !p.matchedImage);

  // Stats
  const totalImages = allImages.length;
  const totalMatchedImages = matchedImages.length;
  const totalUnmatchedImages = unmatchedImages.length;
  const countA = unmatchedImages.filter(i => i.category === 'A').length;
  const countB = unmatchedImages.filter(i => i.category === 'B').length;
  const countC = unmatchedImages.filter(i => i.category === 'C').length;

  const newlyMatchedProducts = products.filter(p => p.matchType === 'new' || p.matchType === 'page');

  document.getElementById('status').innerText = 'Done!';
  document.getElementById('stats').innerHTML = `
    <strong>Total Images Scanned:</strong> ${totalImages} |
    <strong>Images Matched:</strong> ${totalMatchedImages} |
    <strong>Images Unmatched:</strong> ${totalUnmatchedImages} (Category A: ${countA}, Category B: ${countB}, Category C: ${countC})<br>
    <strong>Total Website Products Checked:</strong> ${products.length} catalog products + 24 verified brand products |
    <strong>Products With Images:</strong> ${matchedProducts.length} (${newlyMatchedProducts.length} newly matched) |
    <strong>Products Without Images:</strong> ${unmatchedProducts.length}
  `;

  // Build JSON updates for catalog_products_normalized.js
  const updates = newlyMatchedProducts.map(p => ({
    id: p.id,
    sku: p.sku,
    image: p.matchedImage,
    reason: p.matchReason
  }));
  document.getElementById('updatesOutput').value = JSON.stringify(updates, null, 2);

  // Render Category Breakdown Table
  const categoryStats = {};
  products.forEach(p => {
    const cat = p.category && p.category.trim() ? p.category.trim() : 'Uncategorized';
    if (!categoryStats[cat]) {
      categoryStats[cat] = { total: 0, added: 0, missing: 0 };
    }
    categoryStats[cat].total++;
    if (p.hasPriorMatch || p.matchedImage) {
      categoryStats[cat].added++;
    } else {
      categoryStats[cat].missing++;
    }
  });

  if (typeof brandProducts !== 'undefined' && Array.isArray(brandProducts)) {
    brandProducts.forEach(bp => {
      const cat = bp.category && bp.category.trim() ? bp.category.trim() : 'Specialty Beverage Equipment';
      if (!categoryStats[cat]) {
        categoryStats[cat] = { total: 0, added: 0, missing: 0 };
      }
      categoryStats[cat].total++;
      if (bp.image && !bp.image.includes('placeholder')) {
        categoryStats[cat].added++;
      } else {
        categoryStats[cat].missing++;
      }
    });
  }

  let catHtml = '<table><thead><tr><th>#</th><th>Category Name</th><th>Total Products</th><th>Added / Real Images</th><th>Missing Images (Placeholders)</th><th>Coverage %</th></tr></thead><tbody>';
  let catIndex = 1;
  let sumTotal = 0, sumAdded = 0, sumMissing = 0;
  Object.keys(categoryStats).sort().forEach(cat => {
    const s = categoryStats[cat];
    const pct = s.total > 0 ? ((s.added / s.total) * 100).toFixed(1) + '%' : '0%';
    sumTotal += s.total;
    sumAdded += s.added;
    sumMissing += s.missing;
    catHtml += `<tr><td>${catIndex++}</td><td><strong>${cat}</strong></td><td>${s.total}</td><td style="color:#28a745;font-weight:bold;">${s.added}</td><td style="color:#dc3545;font-weight:bold;">${s.missing}</td><td><strong>${pct}</strong></td></tr>`;
  });
  const sumPct = sumTotal > 0 ? ((sumAdded / sumTotal) * 100).toFixed(1) + '%' : '0%';
  catHtml += `<tr style="background:#e9ecef;font-weight:bold;"><td>-</td><td>TOTAL</td><td>${sumTotal}</td><td style="color:#28a745;">${sumAdded}</td><td style="color:#dc3545;">${sumMissing}</td><td>${sumPct}</td></tr>`;
  catHtml += '</tbody></table>';
  document.getElementById('categoryTableContainer').innerHTML = catHtml;

  // Render Matched Images Table
  let mHtml = '<table><thead><tr><th>#</th><th>Image Path</th><th>Extracted Models / Tokens</th><th>Matched Products (SKU & ID)</th></tr></thead><tbody>';
  matchedImages.forEach((img, i) => {
    const prodList = img.matchedProducts.map(p => `<strong>${p.sku || p.id}</strong> (${p.id}) [${p.type}]`).join('<br>');
    mHtml += `<tr><td>${i+1}</td><td><code>${img.path}</code></td><td>${img.tokens.join(', ')}</td><td>${prodList}</td></tr>`;
  });
  mHtml += '</tbody></table>';
  document.getElementById('matchedTableContainer').innerHTML = mHtml;

  // Render Unmatched Images Table
  let uHtml = '<table><thead><tr><th>#</th><th>Image Path</th><th>Tokens</th><th>Category</th><th>Detailed Explanation</th></tr></thead><tbody>';
  unmatchedImages.forEach((img, i) => {
    uHtml += `<tr><td>${i+1}</td><td><code>${img.path}</code></td><td>${img.tokens.join(', ')}</td><td><span class="badge badge-unmatched">Category ${img.category}</span></td><td>${img.explanation}</td></tr>`;
  });
  uHtml += '</tbody></table>';
  document.getElementById('unmatchedTableContainer').innerHTML = uHtml;

  window.FULL_AUDIT_DATA = {
    totalImages,
    totalMatchedImages,
    totalUnmatchedImages,
    countA,
    countB,
    countC,
    matchedImagesCount: matchedImages.length,
    newlyMatchedCount: newlyMatchedProducts.length,
    matchedProductsCount: matchedProducts.length,
    unmatchedProductsCount: unmatchedProducts.length,
    updates
  };
});
